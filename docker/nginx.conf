events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;
    server_tokens off;

    # Fast gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen ${PORT};
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        # Strict Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Hardened Security: Block hidden files and dotfiles (.env, .git, etc.)
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }

        # Hardened Security: Block internal directories from direct HTTP access
        location ~ ^/(config|src|storage|tests|bin|migrations|docker)/ {
            deny all;
            return 404;
        }

        # PWA Service Worker & Manifest: NEVER cache sw.js (exact match takes precedence over regex)
        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files $uri =404;
        }

        location = /manifest.json {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            try_files $uri =404;
        }

        # JavaScript and CSS: Revalidate so ES modules and Service Worker precache never serve stale code
        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Static assets with long-lived browser caching
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Main Front Controller Routing
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM FastCGI Handler
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # Real-Time SSE Streaming Optimization (Zero buffering)
            fastcgi_buffering off;
            fastcgi_read_timeout 60s;
            fastcgi_send_timeout 60s;
        }
    }
}
