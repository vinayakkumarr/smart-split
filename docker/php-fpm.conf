[global]
error_log = /var/log/php-fpm.log
log_level = warning

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Fast status & health
ping.path = /ping
ping.response = pong

; Pass container environment variables (Render DB_HOST, DB_USER, etc.) to workers
clear_env = no

; Keep process execution bounded
request_terminate_timeout = 35s
catch_workers_output = yes
decorate_workers_output = no
